<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión – TaskFlow</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-logo">
      <h1>TaskFlow</h1>
    </div>

    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${logoutMsg}" class="alert alert-info" th:text="${logoutMsg}"></div>

    <p class="auth-title">Iniciar Sesión</p>

    <form th:action="@{/auth/login}" method="post">
      <div class="auth-input-group">
        <span class="auth-input-icon">👤</span>
        <input type="text"
               name="username"
               class="form-control"
               placeholder="Ingrese su usuario"
               required
               autocomplete="username"/>
      </div>

      <div class="auth-input-group">
        <span class="auth-input-icon">🔒</span>
        <input type="password"
               name="password"
               class="form-control"
               placeholder="Ingrese su contraseña"
               required
               autocomplete="current-password"/>
      </div>

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">
        Iniciar Sesión
      </button>
    </form>

    <p class="auth-footer">
      ¿No tienes cuenta? <a th:href="@{/auth/register}">Regístrate</a>
    </p>
  </div>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
