<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro – TaskFlow</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-logo">
      <h1>TaskFlow</h1>
      <p>Crea tu cuenta gratis</p>
    </div>

    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <form th:action="@{/auth/register}" method="post">
      <div class="form-group">
        <label class="form-label">Nombre completo</label>
        <input type="text" name="displayName" class="form-control"
               placeholder="Ej: Juan García" required/>
      </div>

      <div class="form-group">
        <label class="form-label">Nombre de usuario</label>
        <input type="text" name="username" class="form-control"
               placeholder="Ej: juan123" required autocomplete="username"/>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control"
               placeholder="Ej: juan@email.com" required/>
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control"
               placeholder="Mínimo 6 caracteres" required minlength="6"
               autocomplete="new-password"/>
      </div>

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">
        Crear Cuenta
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a th:href="@{/auth/login}">Inicia sesión</a>
    </p>
  </div>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
