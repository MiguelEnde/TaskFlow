<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskFlow | Registrarse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; }
        .register-card { background: var(--card-bg); backdrop-filter: blur(10px); padding: 3rem; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border: 1px solid white; animation: fadeInUp 0.6s ease-out; }
        .logo { font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 2rem; background: linear-gradient(to right, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; color: #475569; }
        .form-control { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; box-sizing: border-box; transition: all 0.2s; background: white; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .btn-register { width: 100%; background: var(--primary); color: white; border: none; padding: 0.85rem; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 1rem; }
        .btn-register:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); }
        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.85rem; font-weight: 500; text-align: center; }
        .alert-danger { background: #fee2e2; color: #b91c1c; }
        .footer { text-align: center; margin-top: 2rem; font-size: 0.9rem; color: #64748b; }
        .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="logo">TaskFlow</div>

        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

        <form th:action="@{/auth/register}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">USUARIO</label>
                    <input type="text" name="username" class="form-control" placeholder="Ej: miguel" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">NOMBRE</label>
                    <input type="text" name="displayName" class="form-control" placeholder="Tu Nombre" required/>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">EMAIL</label>
                <input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required/>
            </div>

            <div class="form-group">
                <label class="form-label">CONTRASEÑA</label>
                <input type="password" name="password" class="form-control" placeholder="Mínimo 8 caracteres" required/>
            </div>

            <button type="submit" class="btn-register">Crear mi Cuenta</button>
        </form>

        <div class="footer">
            ¿Ya tienes cuenta? <a th:href="@{/auth/login}">Acceder aquí</a>
        </div>
    </div>
</body>
</html>
