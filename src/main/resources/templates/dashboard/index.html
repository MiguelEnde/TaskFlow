<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskFlow | Dashboard</title>
    <link rel="icon" type="image/png" th:href="@{/img/TaskFLow_FAVI.png}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style th:inline="css">
        :root { --primary: #6366f1; --sidebar-bg: #0f172a; --bg: #f8fafc; --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* FONDO DINÁMICO */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 4rem;
            background-image: linear-gradient(rgba(248, 250, 252, 0.92), rgba(248, 250, 252, 0.92)), url("/img/fondo.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .sidebar { width: 280px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; padding: 1.5rem; z-index: 10; }
        .sidebar-logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 2.5rem; }
        .sidebar-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 10px; color: #94a3b8; text-decoration: none; font-weight: 500; margin-bottom: 0.5rem; }
        .sidebar-item:hover, .sidebar-item.active { background: #1e293b; color: white; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .section-title { font-size: 0.75rem; font-weight: 900; color: #1e293b; margin: 2.5rem 0 1.2rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.7; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        .chart-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 20px; padding: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .chart-card:hover { transform: translateY(-5px); }
        .chart-title { font-size: 0.7rem; font-weight: 800; color: #64748b; margin-bottom: 1.2rem; text-transform: uppercase; letter-spacing: 0.05em; }

        .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 8px; height: 120px; margin-top: 10px; }
        .podium-place { display: flex; flex-direction: column; align-items: center; width: 60px; border-top-left-radius: 10px; border-top-right-radius: 10px; position: relative; }
        .podium-name { font-size: 0.5rem; font-weight: 800; color: #1e293b; position: absolute; top: -15px; width: 70px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p1 { height: 70px; background: var(--gold); order: 2; box-shadow: 0 4px 10px rgba(255, 215, 0, 0.4); }
        .p2 { height: 50px; background: var(--silver); order: 1; box-shadow: 0 4px 10px rgba(192, 192, 192, 0.4); }
        .p3 { height: 35px; background: var(--bronze); order: 3; box-shadow: 0 4px 10px rgba(205, 127, 50, 0.4); }
        .podium-num { font-size: 1.2rem; font-weight: 900; color: rgba(0,0,0,0.1); margin-top: 5px; }

        .card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-radius: 24px; padding: 2.5rem; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .task-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.03); align-items: center; }
        .project-tag { font-size: 0.75rem; font-weight: 700; color: var(--primary); background: #e0e7ff; padding: 4px 10px; border-radius: 6px; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 0.8rem 1.8rem; border-radius: 14px; font-weight: 800; cursor: pointer; transition: all 0.3s; }
        .btn-primary:hover { transform: scale(1.05); background: var(--primary-dark); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 2.5rem; border-radius: 28px; width: 450px; }
        .form-control { width: 100%; padding: 0.8rem; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 0.5rem; box-sizing: border-box; }
        .lang-footer { margin-top: 1rem; display: flex; gap: 10px; justify-content: center; font-size: 0.75rem; }
        .lang-footer a { color: #94a3b8; text-decoration: none; font-weight: 700; }
        .lang-footer a:hover { color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">TaskFlow.</div>
        <nav class="sidebar-nav">
            <a th:href="@{/dashboard}" class="sidebar-item active" th:text="#{nav.dashboard}">Dashboard</a>
            <div style="font-size: 0.7rem; font-weight: 700; color: #64748b; margin: 1.5rem 0 0.5rem;" th:text="#{nav.my_projects}">PROYECTOS</div>
            <div th:each="p : ${projects}">
                <a th:href="@{'/projects/' + ${p.id}}" class="sidebar-item"><span>📁</span> <span th:text="${p.name}">Proyecto</span></a>
            </div>
            <button onclick="openModal('newProjectModal')" style="background:none; border:none; color:var(--primary); font-weight:700; font-size:0.8rem; cursor:pointer; padding:1rem; text-align:left;" th:text="#{nav.new_project}">+ NUEVO PROYECTO</button>
        </nav>
        <div style="margin-top:auto; border-top:1px solid #1e293b; padding-top:1.5rem;">
            <form th:action="@{/auth/logout}" method="post"><button type="submit" style="width:100%; background:#1e293b; color:white; border:none; padding:0.6rem; border-radius:8px; cursor:pointer;" th:text="#{nav.logout}">Logout</button></form>
            <div class="lang-footer">
                <a th:href="@{/dashboard(lang='es')}">ES</a><a th:href="@{/dashboard(lang='en')}">EN</a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div><h1 style="margin:0; font-weight:900; font-size:2.2rem; color:#1e293b;" th:text="#{header.title}">Dashboard</h1><p style="color:#64748b; margin-top:0.3rem; font-weight:500;" th:text="#{header.subtitle}">Resumen</p></div>
            <button class="btn-primary" onclick="openModal('quickTaskModal')" th:text="#{btn.new_task}">⚡ Nueva Tarea</button>
        </div>

        <div class="section-title" th:text="#{section.global_vision}">🌍 Visión Global</div>
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title" th:text="#{chart.top_collaborators}">🏆 Top Users</div>
                <div class="podium-container">
                    <div th:if="${ranking.size() > 0}" class="podium-place p1"><span class="podium-name" th:text="${ranking[0].key}">User</span><span class="podium-num">1</span></div>
                    <div th:if="${ranking.size() > 1}" class="podium-place p2"><span class="podium-name" th:text="${ranking[1].key}">User</span><span class="podium-num">2</span></div>
                    <div th:if="${ranking.size() > 2}" class="podium-place p3"><span class="podium-name" th:text="${ranking[2].key}">User</span><span class="podium-num">3</span></div>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title" th:text="#{chart.global_status}">Estado Global</div>
                <div style="height:120px;"><canvas id="globalDonut"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title" th:text="#{chart.ranking_tasks}">Ranking</div>
                <div style="height:120px;"><canvas id="rankingChart"></canvas></div>
            </div>
        </div>

        <div class="section-title" th:text="#{section.personal_productivity}">👤 Mi Productividad</div>
        <div class="charts-grid" style="grid-template-columns: 1fr 2fr;">
            <div class="chart-card">
                <div class="chart-title" th:text="#{chart.my_status}">Mis Estados</div>
                <div style="height:120px;"><canvas id="myDonut"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title" th:text="#{chart.my_progress}">Mi Progreso</div>
                <div style="display:flex; flex-direction:column; justify-content:center; height:120px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:800; font-size:0.9rem; color:#1e293b;">
                        <span th:text="#{progress.completed}">Completado</span>
                        <span th:text="${(myDone + myTodo + myDoing > 0) ? (myDone * 100 / (myDone + myTodo + myDoing)) : 0} + '%'">0%</span>
                    </div>
                    <div style="width:100%; height:14px; background:#f1f5f9; border-radius:7px; overflow:hidden; border: 1px solid #e2e8f0;">
                        <div th:style="'width:' + ${(myDone + myTodo + myDoing > 0) ? (myDone * 100 / (myDone + myTodo + myDoing)) : 0} + '%; height:100%; background:linear-gradient(90deg, #6366f1, #818cf8); transition:width 1s;'"></div>
                    </div>
                    <div style="margin-top:15px; font-size:0.75rem; color:#64748b; font-weight:600;">
                        <span th:text="#{progress.summary(${myDone}, ${myDone + myTodo + myDoing})}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 style="margin:0 0 1.5rem 0; font-size:1.1rem; font-weight:900; color:#1e293b;" th:text="#{table.current_tasks}">Tareas</h2>
            <div class="task-row" style="background:#f8fafc; border-radius:12px; font-weight:800; font-size:0.75rem; color:#64748b; border: 1px solid #f1f5f9;">
                <div th:text="#{table.col.task}">TAREA</div><div th:text="#{table.col.project}">PROYECTO</div><div th:text="#{table.col.priority}">PRIORIDAD</div><div style="text-align:right;" th:text="#{table.col.status}">ESTADO</div>
            </div>
            <div th:each="task : ${allTasks}" class="task-row">
                <div style="font-weight:700; color:#1e293b;" th:text="${task.title}">Tarea</div>
                <div><span class="project-tag" th:text="${task.project.name}">Proyecto</span></div>
                <div th:text="#{${'task.priority.' + task.priority.name().toLowerCase()}}" style="font-weight:700; font-size:0.8rem; color:#64748b;">Prioridad</div>
                <div style="text-align:right;"><span th:text="#{${'task.status.' + task.status.name().toLowerCase()}}" style="font-size:0.75rem; font-weight:800; color:var(--primary);">Estado</span></div>
            </div>
        </div>
    </div>

    <!-- MODALES OMITIDOS PARA BREVEDAD -->
    <div class="modal" id="quickTaskModal">
        <div class="modal-content">
            <h2 th:text="#{modal.task.title}">Añadir Tarea</h2>
            <form th:action="@{/dashboard/tasks/add}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label th:text="#{table.col.project}">PROYECTO</label>
                <select name="projectId" class="form-control" required><option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option></select>
                <label style="margin-top:1rem; display:block;" th:text="#{table.col.task}">TÍTULO</label>
                <input type="text" name="title" class="form-control" required/>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1rem;">
                    <select name="status" class="form-control"><option value="TODO" th:text="#{task.status.todo}"></option><option value="IN_PROGRESS" th:text="#{task.status.in_progress}"></option><option value="DONE" th:text="#{task.status.done}"></option></select>
                    <select name="priority" class="form-control"><option value="LOW" th:text="#{task.priority.low}"></option><option value="MEDIUM" th:text="#{task.priority.medium}"></option><option value="HIGH" th:text="#{task.priority.high}"></option></select>
                </div>
                <div style="display:flex; gap:10px; margin-top:2rem;">
                    <button type="button" onclick="closeModal('quickTaskModal')" class="form-control" style="flex:1;" th:text="#{modal.cancel}"></button>
                    <button type="submit" class="btn-primary" style="flex:2;" th:text="#{modal.add}"></button>
                </div>
            </form>
        </div>
    </div>
    <div class="modal" id="newProjectModal">
        <div class="modal-content">
            <h2 th:text="#{modal.project.title}">Nuevo Proyecto</h2>
            <form th:action="@{/dashboard/projects/new}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="text" name="name" class="form-control" th:placeholder="#{modal.project.title}" required/>
                <div style="display:flex; gap:10px; margin-top:2rem;">
                    <button type="button" onclick="closeModal('newProjectModal')" class="form-control" style="flex:1;" th:text="#{modal.cancel}"></button>
                    <button type="submit" class="btn-primary" style="flex:2;" th:text="#{modal.create}"></button>
                </div>
            </form>
        </div>
    </div>

    <!-- DATA -->
    <input type="hidden" id="statusLabels" th:value="${statusLabelsStr}"/>
    <input type="hidden" id="globalVals" th:value="${globalTodo + ',' + globalDoing + ',' + globalDone}"/>
    <input type="hidden" id="myVals" th:value="${myTodo + ',' + myDoing + ',' + myDone}"/>
    <input type="hidden" id="rankingNames" th:value="${rankingNamesStr}"/>
    <input type="hidden" id="rankingValues" th:value="${rankingValuesStr}"/>

    <script>
        function openModal(id) { document.getElementById(id).style.display='flex'; }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        const sLabels = document.getElementById('statusLabels').value.split(',');
        const commonOptions = { plugins:{ legend:{ position:'right', labels:{ boxWidth:8, font:{ size:8, weight:'700' } } } }, cutout:'70%', animation: { animateScale: true } };

        new Chart(document.getElementById('globalDonut'), {
            type:'doughnut',
            data: { labels: sLabels, datasets: [{ data: document.getElementById('globalVals').value.split(','), backgroundColor:['#cbd5e1','#f59e0b','#10b981'], borderWidth:0 }] },
            options: commonOptions
        });

        new Chart(document.getElementById('myDonut'), {
            type:'doughnut',
            data: { labels: sLabels, datasets: [{ data: document.getElementById('myVals').value.split(','), backgroundColor:['#cbd5e1','#f59e0b','#10b981'], borderWidth:0 }] },
            options: commonOptions
        });

        const rNames = document.getElementById('rankingNames').value;
        const rValues = document.getElementById('rankingValues').value;
        if(rNames) {
            new Chart(document.getElementById('rankingChart'), {
                type:'bar',
                data: { labels: rNames.split(','), datasets:[{ label:'Tareas', data:rValues.split(','), backgroundColor:'#6366f1', borderRadius:6 }] },
                options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, grid:{ display:false }, ticks:{font:{size:8, weight:'700'}} }, x:{ grid:{ display:false }, ticks:{font:{size:8, weight:'700'}} } } }
            });
        }
        window.addEventListener("load", () => {
            document.body.style.opacity = "0";
            document.body.style.transform = "scale(0.98)";

            setTimeout(() => {
                document.body.style.transition = "all 0.5s ease";
                document.body.style.opacity = "1";
                document.body.style.transform = "scale(1)";
            }, 50);
        });
    </script>
</body>
</html>
